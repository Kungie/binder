<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binder VPN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { overflow: hidden; }
  body { margin: 0; background: #0B0B0C; color: #EDEDED; font: 13px/1.4 -apple-system, "Inter", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 28px 24px; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 15px; font-weight: 500; }
  p { margin: 0; color: #A1A1A1; font-size: 12px; text-align: center; }
  form { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
  input { height: 30px; border-radius: 8px; border: 1px solid #26262A; background: #1C1C1F; color: #EDEDED; padding: 0 10px; font: inherit; outline: none; -webkit-user-select: text; user-select: text; }
  input:focus { border-color: #6B6B6B; }
  button { height: 30px; border-radius: 8px; border: 0; background: #EDEDED; color: #0B0B0C; font: inherit; font-weight: 500; cursor: default; }
  button:disabled { opacity: .5; }
  #error { color: #EB5757; min-height: 17px; }
  .note { color: #6B6B6B; font-size: 11px; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="">
  <h1>Binder VPN</h1>
  <p>Sign in with the user name and password you were given.</p>
  <form id="form">
    <input id="user" placeholder="User name" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go" type="submit">Sign In</button>
  </form>
  <p id="error" role="alert"></p>
  <p class="note">Needs the Tailscale app, opened once.</p>
</main>
<script>
  const form = document.getElementById("form");
  const go = document.getElementById("go");
  const error = document.getElementById("error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    go.disabled = true;
    go.textContent = "Signing in…";
    try {
      await window.__TAURI__.core.invoke("sign_in", { user: document.getElementById("user").value, password: document.getElementById("password").value });
    } catch (err) {
      error.textContent = String(err);
      go.disabled = false;
      go.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
