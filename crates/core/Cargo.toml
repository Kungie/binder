[package]
name = "binder-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
