[package]
name = "binder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "binder-cli"
path = "src/main.rs"

[dependencies]
binder-core = { path = "../core" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
